name: banking-platform-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        continue-on-error: true
      - run: docker build -t banking-platform:portfolio .
        continue-on-error: true
      - run: kubectl apply --dry-run=client -f deploy/k8s
