name: banking-platform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portfolio-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portfolio repository validation
        shell: bash
        run: |
          echo "Validating sanitized Banking and Credit Operations portfolio"
          echo "Deployment manifests:"
          find deploy -type f -name '*.yaml' -print 2>/dev/null || true
          echo "Infrastructure and delivery files:"
          find infra ansible azure-devops monitoring docs .semaphore -maxdepth 4 -type f -print 2>/dev/null || true
          echo "Validation complete"
