trigger:
  branches:
    include: [main]

stages:
- stage: Validate
  jobs:
  - job: NodeValidation
    pool: { vmImage: ubuntu-latest }
    steps:
    - task: NodeTool@0
      inputs: { versionSpec: '20.x' }
    - script: npm ci
    - script: npm test --if-present
    - script: npm run lint --if-present

- stage: InfrastructurePlan
  dependsOn: Validate
  jobs:
  - job: TerraformPlan
    steps:
    - script: terraform -chdir=infra/terraform/azure init
    - script: terraform -chdir=infra/terraform/azure plan

- stage: Deploy
  dependsOn: InfrastructurePlan
  condition: succeeded()
  jobs:
  - deployment: Production
    environment: banking-production
    strategy:
      runOnce:
        deploy:
          steps:
          - script: kubectl apply --dry-run=client -f deploy/k8s
