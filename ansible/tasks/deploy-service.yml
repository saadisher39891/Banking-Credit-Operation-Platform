- name: Deploy a Node.js service
  hosts: application_nodes
  become: true
  vars:
    service_name: credit-origination
    image_tag: latest
  tasks:
    - name: Pull image
      community.docker.docker_image:
        name: registry.example.com/{{ service_name }}
        tag: "{{ image_tag }}"
        source: pull
    - name: Restart service
      community.docker.docker_container:
        name: "{{ service_name }}"
        image: "registry.example.com/{{ service_name }}:{{ image_tag }}"
        restart_policy: unless-stopped
        state: started
